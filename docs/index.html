<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BreakIt: See how your UI breaks before your users do.">
  <title>BreakIt</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20242b; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 1rem; line-height: 1.7; }
    main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; overflow-wrap: anywhere; }
    h1 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 1rem; letter-spacing: -0.025em; }
    h2 { font-size: 1.25rem; line-height: 1.35; margin: 2rem 0 0.75rem; }
    p, ul { margin: 0 0 1rem; }
    ul { padding-left: 1.5rem; }
    a { color: #174ea6; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .updated { color: #535b65; }
    @media print { main { max-width: none; padding: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>BreakIt</h1>
    <p>See how your UI breaks before your users do.</p>
    <p>A local Chrome extension for text expansion, pseudo-localization, RTL stress, and suspected overflow highlighting.</p>
    <p><a href="privacy/">Privacy policy</a></p>
  </main>
</body>
</html>
